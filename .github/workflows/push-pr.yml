name  : CiCD
#ABC

on: 
  push: 
    branches: 
      - main   # firts brach 
      - master   # scond brabch  
      - "release/**" 
    paths: 
      - "src/**" 

  pull_request: 
    branches:  
      - main 
      - master
      - "release/**"
            
jobs: 
  test: 
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout code 
        uses: actions/checkout@v4.2.2

      -
         name: Run test 
         run: npm test
